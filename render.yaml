services:
  - type: web
    name: physiovision-api
    runtime: python
    plan: free
    buildCommand: bash build.sh
    # Gemini planning can take longer than Gunicorn's 30-second default. Keep
    # the worker alive long enough for two bounded provider attempts, and use
    # threads so health checks and ordinary API traffic remain responsive.
    startCommand: gunicorn -c gunicorn.conf.py backend.wsgi:application
    healthCheckPath: /api/health/
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: gmail_api
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: GMAIL_SENDER_NAME
        value: PhysioVision
      - key: AUTH_TOKEN_TTL_HOURS
        value: "12"
      - key: EMERGENCY_ALERT_PROVIDER
        value: vonage
      - key: VONAGE_APPLICATION_ID
        sync: false
      - key: VONAGE_PRIVATE_KEY
        sync: false
      - key: VONAGE_FROM_NUMBER
        value: "123456789"
      - key: VONAGE_DEMO_MODE
        value: "True"
      - key: VONAGE_DEMO_TO_NUMBER
        sync: false
      - key: EMERGENCY_ALERT_DELAY_SECONDS
        value: "60"
      - key: EMERGENCY_CONTACT_VERIFICATION_TTL_MINUTES
        value: "10"
      - key: EMERGENCY_CONTACT_VERIFICATION_COOLDOWN_SECONDS
        value: "60"
      - key: EMERGENCY_CONTACT_VERIFICATION_MAX_ATTEMPTS
        value: "5"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_PLANNER_TIMEOUT_MS
        value: "50000"
      - key: GEMINI_TTS_MODEL
        value: gemini-3.1-flash-tts-preview
      - key: GEMINI_TTS_VOICE
        value: Sulafat
