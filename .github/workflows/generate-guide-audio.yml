name: Generate movement guide audio

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-guide-audio.yml"
      - "scripts/generate-guide-audio.py"
      - "scripts/export-guide-audio-catalog.mjs"
  workflow_dispatch:
    inputs:
      max_clips:
        description: "Maximum new clips to generate in this run"
        required: true
        # The first quota-safe run saved three clips. Six clips now remain in
        # the one-exercise Half Squats presentation pack.
        default: "6"
      exercise_target:
        description: "Exercise to prioritize; leave blank for the full catalogue order"
        required: false
        default: "half-squats"
      audio_pack:
        description: "Prepared-audio pack; keep the default for the presentation"
        required: false
        default: "half-squats-one-exercise"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY }}
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Sulafat
      GUIDE_AUDIO_LIMIT: ${{ inputs.max_clips || '6' }}
      GUIDE_AUDIO_EXERCISE: ${{ inputs.exercise_target || 'half-squats' }}
      GUIDE_AUDIO_PACK: ${{ inputs.audio_pack || 'half-squats-one-exercise' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Gemini client
        run: pip install "google-genai>=2.3.0"
      - name: Generate a quota-safe batch
        run: >-
          python scripts/generate-guide-audio.py
          --exercise "$GUIDE_AUDIO_EXERCISE"
          --pack "$GUIDE_AUDIO_PACK"
          --limit "$GUIDE_AUDIO_LIMIT"
          --delay-seconds 65
      - name: Commit generated clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/movement-guide
          if git diff --cached --quiet; then
            echo "No new audio files were generated."
            exit 0
          fi
          git commit -m "Generate movement guide audio"
          git push
